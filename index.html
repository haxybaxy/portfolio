<!doctype html>
<html lang="en" class="motion-safe:scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- The SVG koi swaps light/dark with the colour scheme; the ICO is a black tile for browsers that ignore SVG icons -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zaid Alsaheb</title>
    <!-- Runs before first paint. `js` lets content wait on JS to appear (see index.css); the theme follows the system so there is no flash, and the toggle only overrides it for this tab -->
    <script>
      document.documentElement.classList.add('js')
      try {
        // Posts used to live at #/writing/<slug>, so keep links to them working
        const legacy = /^#(\/writing(?:\/[^/]+)?)$/.exec(location.hash)
        if (legacy) location.replace(legacy[1])

        localStorage.removeItem('theme') // older builds saved the toggle for good
        const stored = sessionStorage.getItem('theme')
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body class="bg-bg font-mono text-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
